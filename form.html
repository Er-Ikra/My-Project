<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="/PROJECTS/form.css">
</head>

<body>
    <div>
        <h1>HOSTEL REGISTRATION FORM </h1>

        <P>If you are visiting this form first time then read the Instructions carefully then fill the required details
            and submit the information. After that you will get Application No. and Password.</P>

        <h2>Registration Form</h2>
        <form action="/action">
            <div>
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Chaudhary_Charan_Singh_University%2C_Meerut%2C_Uttar_Pradesh%2C_India.jpg/250px-Chaudhary_Charan_Singh_University%2C_Meerut%2C_Uttar_Pradesh%2C_India.jpg">
                <span><input type="text" placeholder="First Name" name="fname" />
                <input type="text" placeholder="Last Name" name="lname" /></span>
                <input type="text" placeholder="Course" name="Cname" />
                <input type="text" id="Sunject" placeholder="Subject" />
                <input type="text" placeholder="Course type" />
                <input type="text" placeholder="Email ID" />
                <input type="text" placeholder="Phone No">
                <div class="box box 4"> <input type="file" /></div>
            </div>
            <br>
            <div>
                <label for="gender">please select gender</label>
                <select name="gender" id="gender">
                    <option value="f">female</option>
                    <option value="m"> male</option>
                    <option value="o"> others</option>
            </div>
            <br>
            <div>
                <input type="checkbox" id="tos-agree" name="tos-agree" />
                <label for="tos-agree"> Yes,I agree</label>
                </select>
            </div>
            <button>Submit</button>
        </form>
    </div>

</body>

</html>
